<svg xmlns="http://www.w3.org/2000/svg" viewBox="-413 -85 1073 655" class="plan" role="img" aria-labelledby="plan-title plan-desc">
<title id="plan-title">Schematische Axonometrie des Berufsausbildungszentrums in Kabul</title>
<desc id="plan-desc">Linienzeichnung ohne Maßstab: Werkstatthalle mit Sheddach, zweigeschossiges Wohnheim, Lehrküche mit Essbereich, Unterrichtsgebäude, Sportplatz und Hof mit Bäumen. Raumprogramm, schematisch – kein Bauplan.</desc>
<style>
.ln{fill:none;stroke:#52708F;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.ln-plot{stroke:#14263A;stroke-width:1.6}.ln-detail{stroke-width:1}
.ln-faint{stroke:rgb(82 112 143/.45);stroke-width:1;stroke-dasharray:4 5}
.ln-terra{stroke:#B4441F;stroke-width:1.4}.ln-holz{stroke:#C79A62;stroke-width:1.4}.ln-dim{stroke:rgb(82 112 143/.45);stroke-width:.9}
@media (prefers-color-scheme:dark){.ln{stroke:#7F9AB4}.ln-plot{stroke:#EFE9DD}.ln-faint,.ln-dim{stroke:rgb(127 154 180/.45)}.ln-terra{stroke:#F0925F}.ln-holz{stroke:#D9B27F}}
@keyframes draw{to{stroke-dashoffset:0}}
.ln{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.2s cubic-bezier(.25,.6,.2,1) both;animation-delay:calc(var(--i,0)*16ms)}
@media (prefers-reduced-motion:reduce){.ln{animation:none;stroke-dashoffset:0}}
</style>
